[workspace]
members = ["crates/fusion-kit-core", "crates/fusion-kit-python"]
default-members = ["crates/fusion-kit-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
fusion-kit-core = { path = "crates/fusion-kit-core", version = "=0.1.0" }
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs", "zstd"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zstd = { version = "0.14.3", default-features = false }
crc32fast = "1.5"
sha2 = "0.11"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[workspace.lints.rust]
unused_must_use = "deny"
