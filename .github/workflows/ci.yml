name: CI and distribution checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  source:
    name: Check source and build sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --locked --no-install-project
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p fusion-kit-core --locked
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --all-targets --locked
      - run: uv run --no-sync ruff check python examples tests/python tests/typing scripts/check_distribution.py scripts/verify_wheel_install.py scripts/third_party_notices.py
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/third_party_notices.py --check
      - run: uv run --no-sync maturin sdist --out dist
      - run: uv run --no-sync python scripts/check_distribution.py sdist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: Build and install ${{ matrix.platform }}
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64 }
          - { os: windows-2025, platform: windows-x86_64 }
          - { os: macos-15, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.17"
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --locked --no-install-project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distribution-sdist
          path: input
      - run: uv run --no-sync python scripts/check_distribution.py sdist input --extract build/source
      - name: Build in the manylinux baseline image
        if: runner.os == 'Linux'
        run: |
          rust_sysroot=$(rustc --print sysroot)
          maturin_exe="$PWD/.venv/bin/maturin"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/build:/build" -v "$rust_sysroot:/rust:ro" -v "$maturin_exe:/maturin:ro" \
            -w /build/source -e CARGO_HOME=/build/cargo \
            -e 'RUSTFLAGS=--remap-path-prefix=/build=. --remap-path-prefix=/rust=/toolchain' \
            "$MANYLINUX_IMAGE" bash -euc '
              export PATH="/rust/bin:$PATH"
              /maturin build --release --locked --strip \
                --interpreter /opt/python/cp311-cp311/bin/python \
                --compatibility manylinux_2_28 pypi --auditwheel check --out /build/wheel
            '
      - name: Build a native wheel from the extracted sdist
        if: runner.os != 'Linux'
        working-directory: build/source
        run: |
          rust_sysroot=$(rustc --print sysroot)
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$rust_sysroot=/toolchain"
          uv run --no-sync --project "$GITHUB_WORKSPACE" maturin build --release --locked --strip \
            --interpreter python --compatibility pypi --out ../wheel
      - name: Inspect wheel metadata, RECORD and native dependencies
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
        run: uv run --no-sync python scripts/check_distribution.py wheel build/wheel --platform "$WHEEL_PLATFORM" --audit
      - name: Install on the glibc baseline with no network or Rust
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none \
            -v "$PWD/build:/build:ro" -v "$PWD/scripts/verify_wheel_install.py:/verify_wheel_install.py:ro" \
            "$MANYLINUX_IMAGE" bash -euc '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              if command -v rustc; then exit 1; fi
              for abi in cp311 cp312 cp313 cp314 cp315; do
                "/opt/python/$abi-$abi/bin/python" /verify_wheel_install.py /build/wheel /build/source
              done
            '
      - name: Run installed Linux wheel tests on each Python version
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD/build:/build:ro" -v "$PWD/scripts/verify_wheel_install.py:/verify_wheel_install.py:ro" \
            "$MANYLINUX_IMAGE" bash -euc '
              for abi in cp311 cp312 cp313 cp314 cp315; do
                "/opt/python/$abi-$abi/bin/python" /verify_wheel_install.py /build/wheel /build/source --pytest-version 9.2.0
              done
            '
      - name: Test the native wheel on Python 3.11
        if: runner.os != 'Linux'
        run: uv run --no-sync python scripts/verify_wheel_install.py build/wheel build/source --pytest-version 9.2.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os != 'Linux'
        with:
          python-version: "3.15"
      - name: Test the native wheel on Python 3.15
        if: runner.os != 'Linux'
        run: python scripts/verify_wheel_install.py build/wheel build/source --pytest-version 9.2.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-${{ matrix.platform }}
          path: build/wheel/*.whl
          if-no-files-found: error

  bundle:
    name: Assemble checked distributions
    needs: [source, wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: bundle
      - run: python scripts/check_distribution.py bundle bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-distributions
          path: bundle/
          if-no-files-found: error
